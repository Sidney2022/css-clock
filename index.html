<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Clock</title>
</head>
<body>
    <div class="slideshow-container">
        <div class="slide fade">
          <div class="image-wrapper">
            <img src="./img/10.jpg" alt="Slide 1" class="slideshow-image">
          </div>
        </div>
        <div class="slide fade">
          <div class="image-wrapper">
            <img src="./img/17.jpg" alt="Slide 2" class="slideshow-image">
          </div>
        </div>
        <div class="slide fade">
          <div class="image-wrapper">
            <img  src="./img/natalya-letunova-c_KfK8v9aQ4-unsplash.jpg" alt="Slide 3" class="slideshow-image">
          </div>
        </div>
      </div>
      
      
    <div class="container">
        <div class="display" >
        </div>
        
        <div class="clock" >
            <span class="clock-center"></span>
            <div class="clock-wrapper">
                <p class="clock-hand second-hand"></p>
                <p class="clock-hand minute-hand"></p>
                <p class="clock-hand hour-hand"></p>
            </div>
            <div class="clock-digits">
                <p class="clock-digit" style="--i:1">1</p>
                <p class="clock-digit" style="--i:2">2</p>
                <p class="clock-digit" style="--i:3">3 </p>
                <p class="clock-digit" style="--i:4">4</p>
                <p class="clock-digit" style="--i:5">5</p>
                <p class="clock-digit" style="--i:6">6</p>
                <p class="clock-digit" style="--i:7">7</p>
                <p class="clock-digit" style="--i:8">8</p>
                <p class="clock-digit" style="--i:9">9</p>
                <p class="clock-digit" style="--i:10">10</p>
                <p class="clock-digit" style="--i:11">11</p>
                <p class="clock-digit" style="--i:12">12</p>
            </div>
        </div>
    </div>

    <div class="clock-color-scheme">
        <h2>Change Color Scheme</h2>
        <div class="clock-color-items">
            <div class="color-item">
                <label for="clock-hand">Second Hand</label>
                <input type="color" name=""  id="sec-hand-col" >
            </div>
            <div class="color-item">
                <label for="clock-hand">Minute Hand</label>
                <input type="color" name=""  id="min-hand-col" >
            </div>
            <div class="color-item">
                <label for="clock-hand">Hour Hand</label>
                <input type="color" name=""  id="hour-hand-col" >
            </div>
            <div class="color-item">
                <label for="clock-hand">Clock Digits</label>
                <input type="color" name="" id="clock-digits-col" data-component="color|clock-digits">
            </div>
            <div class="color-item">
                <label for="clock-hand">Clock Frame</label>
                <input type="color" name="" id="clock-frame-col" >
            </div>
    
            <div class="clock-bg">
                
                <label for="clock-hand">Clock Background </label>
                <div class="clock-bg-images">
                    <div class=""><input type="color" name="" id="clock-bg-col" ></div>
                    <div class="clock-bg-image clock-bg-img1"></div>
                    <div class="clock-bg-image clock-bg-img2"></div>
                    <div class="clock-bg-image clock-bg-img3"></div>
                    <div class="clock-bg-image clock-bg-img4"></div>
                    <div class="clock-bg-image clock-bg-img5"></div>
                    <div class="clock-bg-image clock-bg-img6"></div>
                    <div class="clock-bg-image clock-bg-img7"></div>
                </div>
                <div class="color">
                </div>
            </div>
        </div>
    </div>

    <button class="navbar">  toggle </button>

    <script>
        const secondHand = document.querySelector(".second-hand")
        const minuteHand = document.querySelector(".minute-hand")
        const hourHand = document.querySelector(".hour-hand")
        const display = document.querySelector(".display")

        function setDate() {
            const now = new Date();
            var seconds = now.getSeconds();
            const secondsDegrees = ( (seconds / 60) * 360 ) + 90
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`

            const audio = new Audio("./click.mp3");
            audio.play()
            // key.classList.add('sound-active')
            // audio.onended = () =>   key_wrapper.classList.remove('sound-active')

            const minutes = now.getMinutes();
            const minutesDegrees = ( (minutes / 60) * 360 ) + 90
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`

            const hours = now.getHours();
            // const ampm = hours >= 12 ? "PM" : "AM";
            // hr_12_form = hours % 2
            const hoursDegrees = ( (hours % 12 / 12) * 360 ) + (minutes / 60) * 30 + 90
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`
            

            seconds = seconds > 10 ? seconds : `0${seconds}`
            // display.textContent= `${hours} : ${minutes} : ${seconds}`
        }

        setInterval(setDate, 1000)
        // setInterval(setDate, 1000)



            // input elements
var sec_hand_input = document.querySelector('#sec-hand-col')
var min_hand_input = document.querySelector('#min-hand-col')
var hour_hand_input = document.querySelector('#hour-hand-col')

var clock_numbers_input = document.querySelector('#clock-digits-col')
var clock_frame_input = document.querySelector('#clock-frame-col')
var clock_bg_input = document.querySelector('#clock-bg-col')

// actual elements
var second_hand_element = document.querySelector('.second-hand')
var minute_hand_element = document.querySelector('.minute-hand')
var hour_hand_element = document.querySelector('.hour-hand')
var clock_element = document.querySelector('.clock')
var clock_numbers = document.querySelector('.clock-digits')

var clock_bg_image = document.querySelectorAll('.clock-bg-image')



sec_hand_input.addEventListener('input', () => {
    second_hand_element.style.background=sec_hand_input.value
})
min_hand_input.addEventListener('input', () => {
    minute_hand_element.style.background=min_hand_input.value
})
hour_hand_input.addEventListener('input', () => {
    hour_hand_element.style.background=hour_hand_input.value
})

clock_frame_input.addEventListener('input', () => {
    clock_element.style.borderColor=clock_frame_input.value
})
clock_bg_input.addEventListener('input', () => {
    clock_element.style.background=clock_bg_input.value
})

clock_numbers_input.addEventListener('input', () => {

    // clock_numbers.style.visibility='visible'
    // clock_numbers.style.opacity=1
    clock_numbers.style.color=clock_numbers_input.value
})

clock_bg_image.forEach(imageElem => {
    imageElem.addEventListener('click', () => {
        var computedStyles =getComputedStyle(imageElem)        // alert('hi')
        // alert(computedStyles.background)
       clock_element.style.background = computedStyles.background
    })
})



const navbar = document.querySelector('.navbar')
const clock_color_scheme = document.querySelector('.clock-color-scheme')
navbar.addEventListener('click', () => {
    if (clock_color_scheme.classList.contains('scheme-active')) {
        clock_color_scheme.classList.remove('scheme-active')
    } else {
        clock_color_scheme.classList.add('scheme-active')
    }
})




    </script>
</body>
</html>
